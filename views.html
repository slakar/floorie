<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gridline - Saved Views</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      body { min-width: 0; overflow: auto; background: #e8e4da; }
      .views-page { min-height: 100vh; padding: 42px 24px; }
      .views-picker { max-width: 760px; margin: 0 auto 28px; padding: 26px; border: 1px solid #c9c5ba; border-radius: 6px; background: #f7f4ec; box-shadow: 0 18px 60px rgba(48,45,38,.12); text-align: center; }
      .views-picker h1 { margin: 6px 0 16px; font: 400 34px 'Instrument Serif', serif; }
      .views-picker select { width: min(520px, 100%); padding: 12px; border: 1px solid #c9c5ba; border-radius: 4px; background: #fffdf8; color: #292b26; }
      .views-status { margin: 14px 0 0; color: #686a62; font-size: 12px; }
      .views-output { width: min(100%, 1400px); margin: 0 auto; display: grid; gap: 22px; }
      .view-card { min-width: 0; padding: 18px; border: 1px solid #c9c5ba; border-radius: 6px; background: #f7f4ec; box-shadow: 0 10px 34px rgba(48,45,38,.08); }
      .view-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
      .view-card h2 { margin: 0; font: 400 25px 'Instrument Serif', serif; }
      .view-card-header span { display: block; margin-top: 3px; color: #777970; font-size: 11px; font-weight: 700; white-space: nowrap; }
      .view-zoom-controls { display: inline-flex; align-items: center; overflow: hidden; border: 1px solid #c4c0b5; border-radius: 4px; background: #fffdf8; }
      .view-zoom-controls button { width: 34px; height: 32px; border: 0; background: transparent; cursor: pointer; color: #292b26; font-size: 17px; font-weight: 700; }
      .view-zoom-controls button:hover { background: #e9e5da; }
      .view-zoom-controls span { min-width: 58px; margin: 0; text-align: center; color: #686a62; font-size: 10px; }
      .view-canvas-wrap { width: 100%; height: min(620px, calc(100vh - 260px)); min-height: 320px; overflow: hidden; border: 1px solid #ddd8cd; background: #fff; }
      .view-canvas-wrap canvas { display: block; width: 100%; height: 100%; background: #fff; }
      .empty-views { padding: 26px; border: 1px dashed #c9c5ba; border-radius: 6px; background: #f7f4ec; color: #686a62; text-align: center; }
    </style>
  </head>
  <body>
    <main class="views-page">
      <section class="views-picker">
        <span class="eyebrow">Saved floor plan views</span>
        <h1>Project Views</h1>
        <select id="projectSelect"><option value="">Loading projects...</option></select>
        <p id="viewsStatus" class="views-status">Select a project to render its saved views.</p>
      </section>
      <section id="viewsOutput" class="views-output"></section>
    </main>
    <script src="./views.js" defer></script>
  </body>
</html>
